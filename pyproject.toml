[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velux-mqtt"
version = "0.1.0"
description = "Publish VELUX ACTIVE roof windows and blinds to MQTT via the VELUX cloud API, with optional control"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "httpx>=0.27,<1",
    "paho-mqtt>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
velux-mqtt = "velux_mqtt.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
